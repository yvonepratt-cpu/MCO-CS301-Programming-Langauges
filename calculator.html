<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator {
            width: 280px;
            padding: 20px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 22px;
        }

        #display {
            box-sizing: border-box;
            width: 100%;
            height: 50px;
            margin-bottom: 12px;
            padding: 5px 10px;
            font-size: 24px;
            font-family: Arial, sans-serif;
            text-align: right;
            border: 1px solid #999;
            border-radius: 5px;
            background: white;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        button {
            height: 50px;
            font-size: 18px;
            font-family: Arial, sans-serif;
            background: white;
            border: 1px solid #999;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.1s, color 0.1s;
        }

        button:hover {
            background: #eee;
        }

        button:active {
            background: #ddd;
        }

        button.selected,
        button.selected:hover,
        button.selected:active {
            background: #4CAF50;
            color: white;
            border: 1px solid #388E3C;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

<div class="calculator">
    <h2>Calculator</h2>

    <input type="text" id="display" readonly>

    <div class="buttons">
        <!-- Row 1 -->
        <button data-key="Escape" onclick="clearDisplay()">C</button>
        <button data-key="Backspace" onclick="backspace()">⌫</button>
        <button data-key="/" onclick="add('/')">÷</button>
        <button data-key="*" onclick="add('*')">×</button>

        <!-- Row 2 -->
        <button data-key="7" onclick="add('7')">7</button>
        <button data-key="8" onclick="add('8')">8</button>
        <button data-key="9" onclick="add('9')">9</button>
        <button data-key="-" onclick="add('-')">−</button>

        <!-- Row 3 -->
        <button data-key="4" onclick="add('4')">4</button>
        <button data-key="5" onclick="add('5')">5</button>
        <button data-key="6" onclick="add('6')">6</button>
        <button data-key="+" onclick="add('+')">+</button>

        <!-- Row 4 -->
        <button data-key="1" onclick="add('1')">1</button>
        <button data-key="2" onclick="add('2')">2</button>
        <button data-key="3" onclick="add('3')">3</button>
        <button data-key="Enter" onclick="calculate()">=</button>

        <!-- Row 5 -->
        <button class="zero" data-key="0" onclick="add('0')">0</button>
        <button data-key="." onclick="add('.')">.</button>
    </div>
</div>

<script>
    const display = document.getElementById("display");                 // Get display input element
    let justCalculated = false;                                         // Flag: tracks if '=' was just pressed
    let selectedButton = null;                                          // Tracks active highlighted button

    document.querySelectorAll(".buttons button").forEach(button => {    // Loop through all buttons
        button.addEventListener("click", function() {                   // Listen for click events
            setSelection(this);                                         // Highlight clicked button
        });
    });

    function setSelection(btn) {                                        // Function to highlight active button
        if (selectedButton) selectedButton.classList.remove("selected");// Remove highlight from previous button
        if (btn) {                                                      // Check if button exists
            btn.classList.add("selected");                              // Add highlight to current button
            selectedButton = btn;                                       // Update selected button reference
        }
    }

    function isOperator(value) {                                        // Check if value is a math operator
        return ["+", "-", "*", "/"].includes(value);                    // Return true if matches operator list
    }

    function add(value) {                                               // Add numbers/operators to display
        if (justCalculated && !isOperator(value)) display.value = "";   // Clear screen if typing number after '='
        justCalculated = false;                                         // Reset calculation flag

        if (isOperator(value)) {                                        // Handle operators
            if (display.value === "") {                                 // If screen is empty
                if (value === "-") display.value = "-";                 // Allow leading minus sign
                return;                                                 // Exit function
            }
            let lastChar = display.value.slice(-1);                     // Get last character on screen
            if (isOperator(lastChar)) {                                 // If last char is also an operator
                display.value = display.value.slice(0, -1) + value;     // Replace previous operator
                return;                                                 // Exit function
            }
        }

        if (value === ".") {                                            // Handle decimals
            let parts = display.value.split(/[+\-*/]/);                 // Split input into numbers
            let currentNum = parts[parts.length - 1];                   // Get current number
            if (currentNum.includes(".")) return;                       // Prevent multiple dots in one number
            if (display.value === "" || isOperator(display.value.slice(-1))) { // If dot after operator or empty
                display.value += "0";                                   // Prepend zero
            }
        }

        display.value += value;                                         // Append value to display screen
    }

    function clearDisplay() {                                           // Clear calculator display screen
        display.value = "";                                             // Reset display to empty string
        justCalculated = false;                                         // Reset calculation flag
    }

    function backspace() {                                              // Remove last character from screen
        display.value = display.value.slice(0, -1);                     // Slice off last character
        justCalculated = false;                                         // Reset calculation flag
    }

    function safeEvaluate(expr) {                                       // Safe math expression parser (replaces eval)
        const tokens = expr.match(/(\d+\.?\d*|\+|\-|\*|\/)/g);         // Extract numbers and operators into array
        if (!tokens) throw new Error("Invalid expression");             // Throw error if tokens are invalid

        if (tokens[0] === "-") {                                        // Check for leading negative number
            tokens.shift();                                             // Remove minus token
            tokens[0] = "-" + tokens[0];                                // Attach minus to first number
        }

        let i = 0;                                                      // Initialize index counter
        while (i < tokens.length) {                                     // Loop for multiplication & division
            if (tokens[i] === "*" || tokens[i] === "/") {               // If operator is * or /
                const op = tokens[i];                                   // Store operator
                const prev = parseFloat(tokens[i - 1]);                 // Get preceding number
                const next = parseFloat(tokens[i + 1]);                 // Get following number
                if (op === "/" && next === 0) throw new Error("Div by 0");// Prevent division by zero error
                const res = op === "*" ? prev * next : prev / next;     // Compute result
                tokens.splice(i - 1, 3, res.toString());                // Replace tokens with result
                i--;                                                    // Adjust index position
            } else {
                i++;                                                    // Move to next token
            }
        }

        let result = parseFloat(tokens[0]);                             // Init result with first number
        for (let j = 1; j < tokens.length; j += 2) {                    // Loop for addition & subtraction
            const op = tokens[j];                                       // Get operator (+ or -)
            const next = parseFloat(tokens[j + 1]);                     // Get next number
            if (op === "+") result += next;                             // Add value
            if (op === "-") result -= next;                             // Subtract value
        }

        return Math.round(result * 1e10) / 1e10;                        // Fix floating-point precision issues
    }

    function calculate() {                                              // Calculate and show final answer
        let expression = display.value;                                 // Get current expression string
        if (expression === "" || isOperator(expression.slice(-1))) return; // Exit if empty or ends with operator

        try {
            let answer = safeEvaluate(expression);                      // Compute result safely
            if (!Number.isFinite(answer)) throw new Error("Invalid");   // Check if result is valid number
            display.value = answer;                                     // Show result on display
            justCalculated = true;                                      // Set calculation flag to true
        } catch (error) {
            display.value = "Error";                                    // Show Error message on failure
            justCalculated = true;                                      // Set calculation flag to true
        }
    }

    document.addEventListener("keydown", function(event) {              // Listen for physical keyboard input
        let key = event.key;                                            // Get pressed key value
        let mappedKey = key;                                            // Copy key for attribute mapping

        if (key === "=") mappedKey = "Enter";                           // Map '=' key to Enter button
        if (key === "Delete") mappedKey = "Escape";                     // Map Delete key to Escape button

        const btn = document.querySelector(`button[data-key="${mappedKey}"]`); // Find corresponding button
        if (btn) setSelection(btn);                                     // Highlight button if found

        if (key >= "0" && key <= "9") add(key);                         // Handle number keys
        else if (key === ".") add(".");                                 // Handle decimal key
        else if (isOperator(key)) add(key);                             // Handle operator keys
        else if (key === "Enter" || key === "=") {                      // Handle equals / Enter
            event.preventDefault();                                     // Prevent default form submission
            calculate();                                                // Run calculation
        } else if (key === "Backspace") backspace();                    // Handle backspace key
        else if (key === "Escape" || key === "Delete") clearDisplay();  // Handle clear keys
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator {
            width: 280px;
            padding: 20px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 22px;
        }

        #display {
            box-sizing: border-box;
            width: 100%;
            height: 50px;
            margin-bottom: 12px;
            padding: 5px 10px;
            font-size: 24px;
            font-family: Arial, sans-serif;
            text-align: right;
            border: 1px solid #999;
            border-radius: 5px;
            background: white;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        button {
            height: 50px;
            font-size: 18px;
            font-family: Arial, sans-serif;
            background: white;
            border: 1px solid #999;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.1s, color 0.1s;
        }

        button:hover {
            background: #eee;
        }

        button:active {
            background: #ddd;
        }

        button.selected,
        button.selected:hover,
        button.selected:active {
            background: #4CAF50;
            color: white;
            border: 1px solid #388E3C;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

<div class="calculator">
    <h2>Calculator</h2>

    <input type="text" id="display" readonly>

    <div class="buttons">
        <!-- Row 1 -->
        <button data-key="Escape" onclick="clearDisplay()">C</button>
        <button data-key="Backspace" onclick="backspace()">⌫</button>
        <button data-key="/" onclick="add('/')">÷</button>
        <button data-key="*" onclick="add('*')">×</button>

        <!-- Row 2 -->
        <button data-key="7" onclick="add('7')">7</button>
        <button data-key="8" onclick="add('8')">8</button>
        <button data-key="9" onclick="add('9')">9</button>
        <button data-key="-" onclick="add('-')">−</button>

        <!-- Row 3 -->
        <button data-key="4" onclick="add('4')">4</button>
        <button data-key="5" onclick="add('5')">5</button>
        <button data-key="6" onclick="add('6')">6</button>
        <button data-key="+" onclick="add('+')">+</button>

        <!-- Row 4 -->
        <button data-key="1" onclick="add('1')">1</button>
        <button data-key="2" onclick="add('2')">2</button>
        <button data-key="3" onclick="add('3')">3</button>
        <button data-key="Enter" onclick="calculate()">=</button>

        <!-- Row 5 -->
        <button class="zero" data-key="0" onclick="add('0')">0</button>
        <button data-key="." onclick="add('.')">.</button>
    </div>
</div>

<script>
    const display = document.getElementById("display");
    let justCalculated = false;
    let selectedButton = null;

    // Handle mouse click selection styling
    document.querySelectorAll(".buttons button").forEach(button => {
        button.addEventListener("click", function() {
            setSelection(this);
        });
    });

    function setSelection(btn) {
        if (selectedButton) {
            selectedButton.classList.remove("selected");
        }
        if (btn) {
            btn.classList.add("selected");
            selectedButton = btn;
        }
    }

    function isOperator(value) {
        return ["+", "-", "*", "/"].includes(value);
    }

    function add(value) {
        if (justCalculated && !isOperator(value)) {
            display.value = "";
        }
        justCalculated = false;

        if (isOperator(value)) {
            if (display.value === "") {
                if (value === "-") display.value = "-";
                return;
            }

            let lastCharacter = display.value.slice(-1);
            if (isOperator(lastCharacter)) {
                display.value = display.value.slice(0, -1) + value;
                return;
            }
        }

        if (value === ".") {
            let parts = display.value.split(/[+\-*/]/);
            let currentNumber = parts[parts.length - 1];

            if (currentNumber.includes(".")) return;

            if (display.value === "" || isOperator(display.value.slice(-1))) {
                display.value += "0";
            }
        }

        display.value += value;
    }

    function clearDisplay() {
        display.value = "";
        justCalculated = false;
    }

    function backspace() {
        display.value = display.value.slice(0, -1);
        justCalculated = false;
    }

    // Safe and clean arithmetic parser replacing eval()
    function safeEvaluate(expr) {
        const tokens = expr.match(/(\d+\.?\d*|\+|\-|\*|\/)/g);
        if (!tokens) throw new Error("Invalid expression");

        if (tokens[0] === "-") {
            tokens.shift();
            tokens[0] = "-" + tokens[0];
        }

        // Pass 1: Multiplication and Division
        let i = 0;
        while (i < tokens.length) {
            if (tokens[i] === "*" || tokens[i] === "/") {
                const op = tokens[i];
                const prev = parseFloat(tokens[i - 1]);
                const next = parseFloat(tokens[i + 1]);
                
                if (op === "/" && next === 0) throw new Error("Division by zero");
                
                const res = op === "*" ? prev * next : prev / next;
                tokens.splice(i - 1, 3, res.toString());
                i--;
            } else {
                i++;
            }
        }

        // Pass 2: Addition and Subtraction
        let result = parseFloat(tokens[0]);
        for (let j = 1; j < tokens.length; j += 2) {
            const op = tokens[j];
            const next = parseFloat(tokens[j + 1]);
            if (op === "+") result += next;
            if (op === "-") result -= next;
        }

        // Fix floating point issues like 0.1 + 0.2
        return Math.round(result * 1e10) / 1e10;
    }

    function calculate() {
        let expression = display.value;

        if (expression === "" || isOperator(expression.slice(-1))) {
            return;
        }

        try {
            let answer = safeEvaluate(expression);

            if (!Number.isFinite(answer)) {
                throw new Error("Invalid calculation");
            }

            display.value = answer;
            justCalculated = true;
        } catch (error) {
            display.value = "Error";
            justCalculated = true;
        }
    }

    // Support keyboard input with matching visual selection
    document.addEventListener("keydown", function(event) {
        let key = event.key;
        let mappedKey = key;

        if (key === "=") mappedKey = "Enter";
        if (key === "Delete") mappedKey = "Escape";

        const btn = document.querySelector(`button[data-key="${mappedKey}"]`);
        if (btn) setSelection(btn);

        if (key >= "0" && key <= "9") add(key);
        else if (key === ".") add(".");
        else if (isOperator(key)) add(key);
        else if (key === "Enter" || key === "=") {
            event.preventDefault();
            calculate();
        } else if (key === "Backspace") backspace();
        else if (key === "Escape" || key === "Delete") clearDisplay();
    });
</script>

</body>
</html>

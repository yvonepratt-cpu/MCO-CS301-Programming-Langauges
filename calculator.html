<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: white;
            margin: 0;
        }

        .calculator {
            width: 280px;
            margin: 100px auto;
            padding: 20px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 22px;
        }

        #display {
            box-sizing: border-box;
            width: 100%;
            height: 50px;
            margin-bottom: 12px;
            padding: 5px 10px;
            font-size: 24px;
            font-family: Arial, sans-serif;
            text-align: right;
            border: 1px solid #999;
            border-radius: 5px;
            background: white;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        button {
            height: 50px;
            font-size: 18px;
            font-family: Arial, sans-serif;
            background: white;
            border: 1px solid #999;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        button:hover {
            background: #eee;
        }

        button:active {
            background: #ddd;
        }

        /* Color stays on the last clicked button */
        button.selected,
        button.selected:hover,
        button.selected:active {
            background: #4CAF50;
            color: white;
            border: 1px solid #388E3C;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h2>Calculator</h2>

    <input type="text" id="display" readonly>

    <div class="buttons">

        <!-- Row 1 -->
        <button onclick="clearDisplay()">C</button>
        <button onclick="backspace()">⌫</button>
        <button onclick="add('/')">÷</button>
        <button onclick="add('*')">×</button>

        <!-- Row 2 -->
        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button onclick="add('-')">−</button>

        <!-- Row 3 -->
        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button onclick="add('+')">+</button>

        <!-- Row 4 -->
        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button onclick="calculate()">=</button>

        <!-- Row 5 -->
        <button class="zero" onclick="add('0')">0</button>
        <button onclick="add('.')">.</button>

    </div>
</div>

<script>

    const display = document.getElementById("display");

    let justCalculated = false;

    // Remember the last clicked button
    let selectedButton = null;

    // Change the color of the clicked button
    document.querySelectorAll(".buttons button").forEach(button => {
        button.addEventListener("click", function() {

            // Remove the color from the previous button
            if (selectedButton !== null) {
                selectedButton.classList.remove("selected");
            }

            // Color the newly clicked button
            this.classList.add("selected");

            // Remember the selected button
            selectedButton = this;
        });
    });

    // Check whether a character is an operator
    function isOperator(value) {
        return (
            value === "+" ||
            value === "-" ||
            value === "*" ||
            value === "/"
        );
    }

    // Add a number, decimal, or operator
    function add(value) {

        // Start a new calculation after pressing equals
        // when the user enters a number or decimal
        if (justCalculated && !isOperator(value)) {
            display.value = "";
        }

        justCalculated = false;

        // Handle mathematical operators
        if (isOperator(value)) {

            // Allow a negative number at the beginning
            if (display.value === "") {
                if (value === "-") {
                    display.value = "-";
                }
                return;
            }

            let lastCharacter = display.value.charAt(
                display.value.length - 1
            );

            // Replace the previous operator
            if (isOperator(lastCharacter)) {
                display.value =
                    display.value.slice(0, -1) + value;
                return;
            }
        }

        // Handle decimal points
        if (value === ".") {

            let parts = display.value.split(/[+\-*/]/);
            let currentNumber = parts[parts.length - 1];

            // Prevent multiple decimals in one number
            if (currentNumber.includes(".")) {
                return;
            }

            // Add zero before a decimal point when needed
            if (
                display.value === "" ||
                isOperator(
                    display.value.charAt(display.value.length - 1)
                )
            ) {
                display.value += "0";
            }
        }

        display.value += value;
    }

    // Clear the calculator display
    function clearDisplay() {
        display.value = "";
        justCalculated = false;
    }

    // Remove the last character
    function backspace() {
        display.value = display.value.slice(0, -1);
        justCalculated = false;
    }

    // Calculate the answer
    function calculate() {

        let expression = display.value;

        // Do nothing if the display is empty
        if (expression === "") {
            return;
        }

        // Do not calculate if the expression ends with an operator
        if (
            isOperator(expression.charAt(expression.length - 1))
        ) {
            return;
        }

        try {
            let answer = eval(expression);

            // Prevent invalid results such as division by zero
            if (!Number.isFinite(answer)) {
                throw new Error("Invalid calculation");
            }

            // Display the answer, including decimals when needed
            display.value = answer;

            justCalculated = true;

        } catch (error) {
            display.value = "Error";
            justCalculated = true;
        }
    }

    // Support keyboard input
    document.addEventListener("keydown", function(event) {

        let key = event.key;

        if (key >= "0" && key <= "9") {
            add(key);
        }
        else if (key === ".") {
            add(".");
        }
        else if (
            key === "+" ||
            key === "-" ||
            key === "*" ||
            key === "/"
        ) {
            add(key);
        }
        else if (key === "Enter" || key === "=") {
            event.preventDefault();
            calculate();
        }
        else if (key === "Backspace") {
            backspace();
        }
        else if (key === "Escape" || key === "Delete") {
            clearDisplay();
        }
    });

</script>

</body>
</html>

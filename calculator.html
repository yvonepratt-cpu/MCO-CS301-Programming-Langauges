<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: white;
            margin: 0;
        }

        .calculator {
            width: 280px;
            margin: 100px auto;
            padding: 20px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 22px;
        }

        #display {
            box-sizing: border-box;
            width: 100%;
            height: 50px;
            margin-bottom: 12px;
            padding: 5px 10px;
            font-size: 24px;
            font-family: Arial, sans-serif;
            text-align: right;
            border: 1px solid #999;
            border-radius: 5px;
            background: white;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        button {
            height: 50px;
            font-size: 18px;
            font-family: Arial, sans-serif;
            background: white;
            border: 1px solid #999;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #eee;
        }

        button:active {
            background: #ddd;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h2>Calculator</h2>

    <input
        type="text"
        id="display"
        readonly
    >

    <div class="buttons">

        <!-- Row 1 -->
        <button onclick="clearDisplay()">C</button>
        <button onclick="backspace()">⌫</button>
        <button onclick="add('/')">÷</button>
        <button onclick="add('*')">×</button>

        <!-- Row 2 -->
        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <button onclick="add('-')">−</button>

        <!-- Row 3 -->
        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <button onclick="add('+')">+</button>

        <!-- Row 4 -->
        <button onclick="add('1')">1</button>
        <button onclick="add('2')">2</button>
        <button onclick="add('3')">3</button>
        <button onclick="calculate()">=</button>

        <!-- Row 5 -->
        <button class="zero" onclick="add('0')">0</button>
        <button onclick="add('.')">.</button>

    </div>

</div>


<script>

    const display = document.getElementById("display");

    let justCalculated = false;


    // =========================================================
    // ADD NUMBER OR OPERATOR
    // =========================================================
    function add(value) {

        // If the previous action was "="
        // and the user enters a number or decimal,
        // start a new calculation.
        if (
            justCalculated &&
            !isOperator(value)
        ) {
            display.value = "";
        }

        justCalculated = false;


        // -----------------------------------------------------
        // OPERATOR CONTROL
        // -----------------------------------------------------
        if (isOperator(value)) {

            // Allow negative number at the beginning
            if (display.value === "") {

                if (value === "-") {
                    display.value = "-";
                }

                return;
            }


            let lastCharacter =
                display.value.charAt(
                    display.value.length - 1
                );


            // Replace previous operator
            if (isOperator(lastCharacter)) {

                display.value =
                    display.value.slice(0, -1) + value;

                return;
            }
        }


        // -----------------------------------------------------
        // DECIMAL CONTROL
        // -----------------------------------------------------
        if (value === ".") {

            let parts =
                display.value.split(/[+\-*/]/);

            let currentNumber =
                parts[parts.length - 1];


            // Do not allow:
            // 10.5.6
            if (currentNumber.includes(".")) {
                return;
            }


            // If decimal is first:
            // .5 becomes 0.5
            if (
                display.value === "" ||
                isOperator(
                    display.value.charAt(
                        display.value.length - 1
                    )
                )
            ) {
                display.value += "0";
            }
        }


        display.value += value;
    }


    // =========================================================
    // CHECK OPERATOR
    // =========================================================
    function isOperator(value) {

        return (
            value === "+" ||
            value === "-" ||
            value === "*" ||
            value === "/"
        );
    }


    // =========================================================
    // CLEAR
    // =========================================================
    function clearDisplay() {

        display.value = "";

        justCalculated = false;
    }


    // =========================================================
    // BACKSPACE
    // =========================================================
    function backspace() {

        display.value =
            display.value.slice(0, -1);

        justCalculated = false;
    }


    // =========================================================
    // CALCULATE
    // =========================================================
    function calculate() {

        let expression =
            display.value;


        if (expression === "") {
            return;
        }


        // Don't calculate:
        // 10+
        // 10*
        // 10/
        if (
            isOperator(
                expression.charAt(
                    expression.length - 1
                )
            )
        ) {
            return;
        }


        try {

            let answer =
                eval(expression);


            if (!Number.isFinite(answer)) {
                throw new Error();
            }


            display.value =
                answer;


            justCalculated = true;

        }
        catch (error) {

            display.value =
                "Error";

            justCalculated = true;
        }
    }


    // =========================================================
    // KEYBOARD SUPPORT
    // =========================================================
    document.addEventListener(
        "keydown",
        function(event) {

            let key = event.key;


            if (
                key >= "0" &&
                key <= "9"
            ) {
                add(key);
            }

            else if (key === ".") {
                add(".");
            }

            else if (
                key === "+" ||
                key === "-" ||
                key === "*" ||
                key === "/"
            ) {
                add(key);
            }

            else if (
                key === "Enter" ||
                key === "="
            ) {
                calculate();
            }

            else if (key === "Backspace") {
                backspace();
            }

            else if (
                key === "Escape" ||
                key === "Delete"
            ) {
                clearDisplay();
            }
        }
    );

</script>

</body>
</html>
